name: CI

# Safety net behind the local pre-commit hook: the hook auto-fixes formatting
# before a commit exists; this job only reports. It runs the same hooks
# (black, isort, ruff, whitespace) plus the test suite and a strict docs build,
# so a push that skipped the hook or breaks on another Python version goes red.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pre-commit hooks on all files
        run: |
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the test extra
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the docs extra
        run: python -m pip install -e ".[docs]"
      - name: Build documentation (strict)
        run: mkdocs build --strict
